[workspace]
members = ["crates/atelier-bootstrap", "crates/dsh-atelier", "crates/fake-dsh"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
base64 = "0.22.1"
directories = "6.0.0"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std"] }
fs2 = "0.4.3"
image = { version = "0.25.8", default-features = false, features = ["ico", "png"] }
flate2 = "1.1.2"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
semver = { version = "1.0.26", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tempfile = "3.20.0"
tar = "0.4.44"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
tray-icon = "0.21.2"
url = "2.5.4"
winit = "0.30.12"
wry = { version = "0.56.1", default-features = false, features = ["os-webview"] }
zip = { version = "4.3.0", default-features = false, features = ["deflate"] }
winresource = "0.1.23"

[profile.release]
lto = "thin"
strip = "symbols"
